<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tuki Science 🔬 | Colegio Emilia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #3AC7E0; --sky-d: #1E9FBF;
    --sun: #FFC93C; --sun-d: #F5A623;
    --leaf: #4CAF6D; --leaf-d: #2E9450;
    --coral: #FF6B5B; --coral-d: #E8503F;
    --purple: #9B6BFF; --purple-d: #7C4FE0;
    --cream: #FFF8EC; --ink: #2B2440;
    --white: #FFFFFF;
    --shadow: 0 8px 0 rgba(43,36,64,0.18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100vh; margin: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(180deg, #3AC7E0 0%, #68D5E8 45%, #CFF3E4 100%);
    color: var(--ink);
    position: relative;
    overflow-x: hidden;
  }
  h1, h2, h3, .display { font-family: 'Fredoka', sans-serif; }
  
  .hill {
    position: fixed; bottom: 0; left: 0; width: 100%; z-index: 0; pointer-events: none; height: 110px;
  }
  .screen {
    position: relative; z-index: 2; min-height: 100vh; display: none;
    flex-direction: column; align-items: center; padding: 18px 14px 40px;
  }
  .screen.active { display: flex; }
  
  .topbar {
    width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
  }
  .backBtn {
    background: var(--white); border: none; border-radius: 16px; padding: 10px 18px;
    font-family: 'Fredoka'; font-weight: 600; font-size: 16px; color: var(--ink);
    box-shadow: var(--shadow); cursor: pointer; display: flex; align-items: center; gap: 6px;
    text-decoration: none; transition: transform .08s ease;
  }
  .backBtn:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(43,36,64,0.18); }
  .starCounter {
    background: var(--white); border-radius: 16px; padding: 8px 16px;
    font-family: 'Fredoka'; font-weight: 600; font-size: 18px; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 6px;
  }
  
  .homeHeader { text-align: center; margin: 6px 0 10px; }
  .homeHeader h1 { font-size: clamp(28px, 6vw, 44px); color: var(--white); text-shadow: 0 4px 0 rgba(43,36,64,0.25); margin: 6px 0 2px; }
  .homeHeader p { color: var(--white); font-weight: 800; font-size: clamp(14px, 3vw, 18px); margin: 0; opacity: .95; }
  .mascotWrap { width: 130px; margin: 0 auto; }
  
  .menuGrid {
    display: grid; grid-template-columns: repeat(2, minmax(150px, 1fr)); gap: 16px;
    width: 100%; max-width: 840px; margin-top: 14px;
  }
  @media(min-width: 640px) { .menuGrid { grid-template-columns: repeat(3, minmax(150px, 1fr)); } }
  
  .card {
    border: none; cursor: pointer; border-radius: 26px; padding: 22px 14px 18px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    color: var(--white); font-family: 'Fredoka'; font-weight: 600; box-shadow: var(--shadow);
    transition: transform .08s ease; text-align: center;
  }
  .card:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(43,36,64,0.18); }
  .card svg { width: 56px; height: 56px; }
  .card span { font-size: clamp(14px, 3.2vw, 17px); line-height: 1.2; }
  
  .c1 { background: linear-gradient(160deg, var(--coral), var(--coral-d)); }
  .c2 { background: linear-gradient(160deg, var(--purple), var(--purple-d)); }
  .c3 { background: linear-gradient(160deg, var(--leaf), var(--leaf-d)); }
  .c4 { background: linear-gradient(160deg, var(--sun), var(--sun-d)); color: var(--ink); }
  .c5 { background: linear-gradient(160deg, var(--sky), var(--sky-d)); }
  .c6 { background: linear-gradient(160deg, #FF8FB1, #E8557F); }
  .c7 { background: linear-gradient(160deg, #FFAA5B, #E87A2E); }

  .exWrap {
    width: 100%; max-width: 740px; background: var(--white); border-radius: 28px;
    padding: 22px 18px 26px; box-shadow: var(--shadow); margin-top: 8px; text-align: center;
  }
  .progressBar { width: 100%; height: 14px; background: #EDEAF7; border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
  .progressFill { height: 100%; background: linear-gradient(90deg, var(--leaf), var(--sun)); width: 0%; transition: width .4s ease; }
  .exTitle { font-size: clamp(18px, 4.5vw, 24px); margin: 0 0 4px; color: var(--ink); }
  .exSub { color: #6B6285; font-weight: 700; margin: 0 0 14px; font-size: clamp(13px, 3vw, 15px); }
  .stageBox { min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; margin-bottom: 14px; }
  
  .optBtn {
    font-family: 'Fredoka'; font-weight: 600; font-size: clamp(15px, 3.8vw, 19px);
    background: var(--cream); border: 3px solid #EADFC5; border-radius: 18px;
    min-width: 140px; padding: 12px 18px; cursor: pointer; color: var(--ink);
    max-width: 90%; text-align: center; transition: all .1s ease;
  }
  .optBtn:active { transform: translateY(3px); }
  .optBtn.correct { background: var(--leaf); border-color: var(--leaf-d); color: var(--white); }
  .optBtn.wrong { background: var(--coral); border-color: var(--coral-d); color: var(--white); }
  
  .questionCard {
    background: var(--cream); border: 3px solid #EADFC5; border-radius: 18px;
    padding: 14px 16px; margin-bottom: 12px; text-align: left; font-weight: 700;
    font-size: clamp(14px, 3.5vw, 17px); line-height: 1.5; color: var(--ink); width: 100%;
  }
  .feedback { min-height: 34px; font-family: 'Fredoka'; font-weight: 700; font-size: 18px; margin-top: 8px; }
  .feedback.ok { color: var(--leaf-d); }
  .feedback.bad { color: var(--coral-d); }
  
  .continueBtn {
    display: none; margin: 12px auto 0; font-family: 'Fredoka'; font-weight: 700; font-size: 18px;
    background: var(--sun); border: none; border-radius: 16px; padding: 12px 28px;
    box-shadow: 0 5px 0 var(--sun-d); cursor: pointer; color: var(--ink);
  }
  .continueBtn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--sun-d); }
  
  /* TTS Speaker Button */
  .speakBtn {
    background: #F0EBFF; border: 2px solid var(--purple); color: var(--purple-d);
    border-radius: 50%; width: 36px; height: 36px; cursor: pointer; display: inline-flex;
    align-items: center; justify-content: center; font-size: 16px; margin-left: 8px; vertical-align: middle;
  }
  .speakBtn:active { transform: scale(0.92); }

  /* 11x12 Word Search Grid */
  .wsGrid {
    display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px;
    max-width: 440px; margin: 0 auto 14px; user-select: none; touch-action: none;
  }
  .wsCell {
    aspect-ratio: 1; background: var(--cream); border: 2px solid #EADFC5; border-radius: 6px;
    display: flex; align-items: center; justify-content: center; font-family: 'Fredoka';
    font-weight: 700; font-size: clamp(12px, 3vw, 16px); cursor: pointer; color: var(--ink);
    transition: background .15s ease;
  }
  .wsCell.selected { background: var(--sun); border-color: var(--sun-d); color: var(--ink); }
  .wsCell.found { background: var(--leaf); border-color: var(--leaf-d); color: var(--white); }
  
  .wordBankList {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 14px;
  }
  .wbItem {
    background: #F0EBFF; border: 2px solid #D6C7FF; border-radius: 12px;
    padding: 6px 12px; font-weight: 700; font-size: 14px; color: var(--purple-d);
  }
  .wbItem.done { background: var(--leaf); border-color: var(--leaf-d); color: var(--white); text-decoration: line-through; }

  .wsActionRow { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .btnSolution { background: #3AC7E0; border: none; border-radius: 14px; padding: 10px 18px; font-family: 'Fredoka'; font-weight: 700; color: #fff; cursor: pointer; box-shadow: 0 4px 0 #1E9FBF; }
  .btnReset { background: #4CAF6D; border: none; border-radius: 14px; padding: 10px 18px; font-family: 'Fredoka'; font-weight: 700; color: #fff; cursor: pointer; box-shadow: 0 4px 0 #2E9450; }
  .btnSolution:active, .btnReset:active { transform: translateY(3px); }

  /* Memory Game Cards */
  .memGrid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    max-width: 440px; margin: 0 auto 14px;
  }
  @media(min-width: 480px){ .memGrid { grid-template-columns: repeat(4, 1fr); } }
  .memCard {
    aspect-ratio: 1; background: linear-gradient(135deg, var(--purple), var(--purple-d));
    border-radius: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-family: 'Fredoka'; font-weight: 700; font-size: 14px; color: var(--white);
    box-shadow: 0 4px 0 rgba(43,36,64,0.15); transition: transform .2s ease; text-align: center; padding: 6px;
  }
  .memCard.flipped, .memCard.matched { background: var(--cream); color: var(--ink); border: 3px solid #EADFC5; }
  .memCard.matched { background: #E2F7EB; border-color: var(--leaf); color: var(--leaf-d); }
  .memImg { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .memImg svg { width: 100%; height: 100%; }
  .memWord { font-family: 'Fredoka'; font-weight: 700; font-size: clamp(13px, 3.6vw, 17px); line-height: 1.15; }

  /* Fill-in-the-blanks */
  .fillSelect {
    font-family: 'Fredoka'; font-weight: 700; font-size: 15px; padding: 6px 10px;
    border-radius: 12px; border: 2px solid var(--purple); background: var(--white); color: var(--purple-d);
    max-width: 100%; margin: 4px 0;
  }

  /* Drawing Canvas */
  .canvasWrap { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
  canvas { border: 3px dashed var(--sky-d); border-radius: 18px; background: #fff; touch-action: none; cursor: crosshair; }
  .toolRow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
  .colorDot { width: 32px; height: 32px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); cursor: pointer; }
  .colorDot.active { transform: scale(1.15); border-color: var(--ink); }

  /* Illustration Svg Container */
  .svgContainer { width: 160px; height: 140px; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; }

  /* Row of reference illustrations shown above a matching exercise */
  .svgRow { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 12px; width: 100%; }
  .svgRowItem { display: flex; flex-direction: column; align-items: center; width: 104px; }
  .svgRowItem > div { width: 92px; height: 84px; }
  .svgRowItem span { font-family: 'Fredoka'; font-weight: 600; font-size: 13px; color: var(--ink); }

  /* Write-the-name exercises */
  .writeGrid { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; width: 100%; }
  .writeItem {
    background: var(--cream); border: 3px solid #EADFC5; border-radius: 18px; padding: 10px;
    display: flex; flex-direction: column; align-items: center; gap: 6px; width: min(152px, 46%);
  }
  .writeItem .svgContainer { width: 108px; height: 96px; margin: 0; }
  .writeLabel { font-weight: 800; font-size: 14px; text-align: center; line-height: 1.3; }
  .writeInput {
    font-family: 'Fredoka'; font-weight: 600; font-size: 16px; text-align: center; padding: 7px 8px;
    border: 3px solid var(--purple); border-radius: 12px; width: 100%; background: var(--white); color: var(--ink);
  }
  .writeInput.okIn { border-color: var(--leaf-d); background: #E2F7EB; }
  .writeInput.badIn { border-color: var(--coral-d); background: #FFE9E6; }

  /* Animal Parts Tab Cards */
  .animalTabContainer { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
  .animalTabBtn { background: var(--cream); border: 2px solid #EADFC5; border-radius: 12px; padding: 6px 14px; font-family: 'Fredoka'; font-weight: 600; cursor: pointer; }
  .animalTabBtn.active { background: var(--purple); color: #fff; border-color: var(--purple-d); }

  .confetti-piece { position: fixed; top: -20px; width: 10px; height: 14px; z-index: 50; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(400deg); opacity: 0.9; } }
</style>
</head>

<svg class="hill" viewBox="0 0 1440 200" preserveAspectRatio="none">
  <path fill="#CFF3E4" d="M0,120 C240,60 420,180 720,110 C1000,50 1220,150 1440,90 L1440,200 L0,200 Z"></path>

<!-- HOME SCREEN -->
<div class="screen active" id="screen-home">

<!-- EXERCISE SCREEN -->

    <button class="backBtn" onclick="goHome()">🏠 Menú</button>

<script>
/* MASCOT SVG */
const mascotSVG=`<svg viewBox="0 0 160 160" width="100%"><ellipse cx="80" cy="145" rx="34" ry="8" fill="rgba(43,36,64,0.15)"/><path d="M50 90 Q40 60 62 45 Q80 34 98 45 Q120 60 110 90 Q112 120 80 128 Q48 120 50 90 Z" fill="#2B2440"/><path d="M56 85 Q50 62 66 50 Q80 42 94 50 Q110 62 104 85 Q106 110 80 116 Q54 110 56 85 Z" fill="#3AC7E0"/><circle cx="68" cy="66" r="7" fill="#fff"/><circle cx="70" cy="66" r="3.4" fill="#2B2440"/><path d="M78 74 Q100 70 118 78 Q100 86 78 82 Z" fill="#FFC93C"/><path d="M60 108 Q80 118 100 108 Q100 122 80 126 Q60 122 60 108 Z" fill="#FF6B5B"/><path d="M40 92 Q22 88 20 70 Q34 76 44 88 Z" fill="#4CAF6D"/><path d="M120 92 Q138 88 140 70 Q126 76 116 88 Z" fill="#4CAF6D"/></svg>`;
document.getElementById('mascotHome').innerHTML=mascotSVG;
document.getElementById('mascotEnd').innerHTML=mascotSVG;

/* INLINE ANIMAL ILLUSTRATIONS */
const octopusSVG = `<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="40" r="28" fill="#FF6B5B"/><circle cx="40" cy="34" r="5" fill="#fff"/><circle cx="40" cy="34" r="2.5" fill="#2B2440"/><circle cx="60" cy="34" r="5" fill="#fff"/><circle cx="60" cy="34" r="2.5" fill="#2B2440"/><path d="M42 46 Q50 52 58 46" stroke="#2B2440" stroke-width="2.5" fill="none"/><path d="M25 60 Q15 75 30 85 M35 64 Q30 82 45 86 M50 65 Q50 85 55 88 M65 64 Q70 82 80 82 M75 60 Q85 75 75 88" stroke="#FF6B5B" stroke-width="6" stroke-linecap="round" fill="none"/></svg>`;

const eagleSVG = `<svg viewBox="0 0 100 100" width="100%" height="100%"><path d="M20 50 Q50 15 80 50 Q60 45 50 65 Q40 45 20 50 Z" fill="#7C4FE0"/><circle cx="50" cy="30" r="16" fill="#fff"/><circle cx="54" cy="28" r="3" fill="#2B2440"/><path d="M58 30 L74 34 L60 40 Z" fill="#FFC93C"/></svg>`;

const batSVG = `<svg viewBox="0 0 100 100" width="100%" height="100%"><path d="M50 42 Q30 20 7 30 Q17 41 12 54 Q27 47 35 58 Z" fill="#3F3A5C"/><path d="M50 42 Q70 20 93 30 Q83 41 88 54 Q73 47 65 58 Z" fill="#3F3A5C"/><ellipse cx="50" cy="53" rx="13" ry="18" fill="#2B2440"/><path d="M41 36 L38 18 L49 31 Z" fill="#2B2440"/><path d="M59 36 L62 18 L51 31 Z" fill="#2B2440"/><circle cx="45" cy="47" r="3.4" fill="#FFC93C"/><circle cx="55" cy="47" r="3.4" fill="#FFC93C"/><path d="M45 59 L47 65 L50 60 L53 65 L55 59" fill="none" stroke="#fff" stroke-width="2"/></svg>`;

/* SOUND SYNTHESIS */
let audioCtx=null;
function ctx(){if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();}return audioCtx;}
function tone(f,s,d,t='sine',g=0.18){
  try {
    const c=ctx();const o=c.createOscillator();const gn=c.createGain();
    o.type=t;o.frequency.value=f;gn.gain.value=g;o.connect(gn);gn.connect(c.destination);
    o.start(c.currentTime+s);gn.gain.setValueAtTime(g,c.currentTime+s);
    gn.gain.exponentialRampToValueAtTime(0.001,c.currentTime+s+d);o.stop(c.currentTime+s+d+0.02);
  } catch(e){}
}
function playCorrect(){tone(523,0,0.12);tone(659,0.1,0.12);tone(784,0.2,0.22);spawnConfetti();}
function playWrong(){tone(220,0,0.18,'sawtooth',0.12);tone(160,0.15,0.25,'sawtooth',0.12);}
function playTap(){tone(400,0,0.06,'triangle',0.08);}

/* TTS / VOICE READING */
function speakText(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }
}
function getSpeakBtnHtml(text) {
  const safeText = text.replace(/'/g, "\\'");
  return `<button class="speakBtn" onclick="speakText('${safeText}')" title="Escuchar en inglés">🔊</button>`;
}

/* CONFETTI ANIMATION */
function spawnConfetti(){
  const colors=['#FF6B5B','#9B6BFF','#4CAF6D','#FFC93C','#3AC7E0'];
  for(let i=0;i<24;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    el.style.left=Math.random()*100+'vw';
    el.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration=(1.5+Math.random()*1.5)+'s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),3000);
  }
}

/* QUESTION RENDERERS */
function showQuestion() {
  showScreen('screen-exercise');
  const q = questions[currentQIndex];
  
  const pct = Math.round(((currentQIndex) / questions.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  
  document.getElementById('exTitle').innerText = q.title;
  document.getElementById('exSub').innerText = q.sub;
  document.getElementById('feedback').innerText = '';
  document.getElementById('continueBtn').style.display = 'none';
  ynScore = 0;

  const box = document.getElementById('stageBox');
  box.innerHTML = '';

  if (q.type === 'tf') {
    box.innerHTML = `
      <div class="questionCard">
        ${q.q} ${getSpeakBtnHtml(q.q)}
      </div>
      <div class="optionsRow" style="display:flex; gap:16px;">
        <button class="optBtn" onclick="checkTF('True', '${q.ans}', this)">True ✅</button>
        <button class="optBtn" onclick="checkTF('False', '${q.ans}', this)">False ❌</button>
      </div>
    `;
  } else if (q.type === 'mc') {
    let optsHtml = q.opts.map(o => `<button class="optBtn" onclick="checkMC('${o}', '${q.ans}', this)">${o}</button>`).join('');
    box.innerHTML = `
      <div class="questionCard">${q.q} ${getSpeakBtnHtml(q.q)}</div>
      ${q.svg ? `<div class="svgContainer">${q.svg}</div>` : ''}
      <div class="optionsRow" style="display:flex; flex-direction:column; gap:10px; width:100%; align-items:center;">
        ${optsHtml}
      </div>
    `;
  } else if (q.type === 'matching') {
    let pairsHtml = q.pairs.map((p, idx) => `
      <div class="questionCard" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
        <span>${p.info}</span>
        <button class="optBtn" style="min-width:120px; padding:8px 14px;" onclick="checkPair(${idx}, this)">${p.animal}</button>
      </div>
    `).join('');
    box.innerHTML = `<div style="width:100%;">${pairsHtml}</div>`;
  } else if (q.type === 'study') {
    box.innerHTML = q.html;
    document.getElementById('continueBtn').style.display = 'block';
  } else if (q.type === 'fill') {
    let bankHtml = '<div class="wordBankList">' + q.bank.map(b => `<div class="wbItem">${b}</div>`).join('') + '</div>';
    let fillHtml = q.items.map((it, idx) => `
      <div class="questionCard">
        ${it.prefix}
        <select class="fillSelect" id="sel1_${idx}">
          <option value="">--elegir--</option>
          ${it.select.map(s => `<option value="${s}">${s}</option>`).join('')}
        </select>
        ${it.suffix}
        <select class="fillSelect" id="sel2_${idx}">
          <option value="">--elegir--</option>
          ${it.select2.map(s => `<option value="${s}">${s}</option>`).join('')}
        </select>
        ${it.suffix2}
      </div>
    `).join('');
    box.innerHTML = `
      ${bankHtml}
      <div style="width:100%;">${fillHtml}</div>
      <button class="optBtn correct" style="margin-top:10px;" onclick="checkFillAnswers()">Comprobar Respuestas ✔️</button>
    `;
  } else if (q.type === 'yesno') {
    const labels = q.labels || ['YES', 'NO'];
    let ynHtml = q.items.map((it, idx) => `
      <div class="questionCard" style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <span>${it.q}</span>
        <div style="display:flex; gap:8px;">
          <button class="optBtn" style="min-width:60px; padding:6px 12px;" onclick="checkYN(${idx}, '${labels[0]}', '${it.ans}', this)">${labels[0]}</button>
          <button class="optBtn" style="min-width:60px; padding:6px 12px;" onclick="checkYN(${idx}, '${labels[1]}', '${it.ans}', this)">${labels[1]}</button>
        </div>
      </div>
    `).join('');
    box.innerHTML = `<div style="width:100%;">${ynHtml}</div>`;
  } else if (q.type === 'write') {
    let bankHtml = q.bank ? '<div class="wordBankList">' + q.bank.map(b => `<div class="wbItem">${b}</div>`).join('') + '</div>' : '';
    let itemsHtml = q.items.map((it, idx) => `
      <div class="writeItem">
        ${it.svg ? `<div class="svgContainer">${it.svg}</div>` : ''}
        <div class="writeLabel">${idx + 1}. ${it.label || ''}</div>
        <input type="text" class="writeInput" id="wr_${idx}" placeholder="..." autocomplete="off" autocapitalize="none" spellcheck="false">
      </div>
    `).join('');
    box.innerHTML = `
      ${bankHtml}
      <div class="writeGrid">${itemsHtml}</div>
      <button class="optBtn correct" style="margin-top:10px;" onclick="checkWriteAnswers()">Comprobar Respuestas ✔️</button>
    `;
  } else if (q.type === 'wordsearch') {
    renderWordSearch(WS_PUZZLES[q.puzzle], box);
  } else if (q.type === 'partmatch') {
    let rowHtml = q.svgRow ? '<div class="svgRow">' + q.svgRow.map(s => `
      <div class="svgRowItem"><div>${s.svg}</div><span>${s.label}</span></div>
    `).join('') + '</div>' : '';
    let pmHtml = q.items.map((it, idx) => `
      <div class="questionCard" style="display:flex; flex-direction:column; gap:6px;">
        <span><strong>${it.part}${/[.?!:]$/.test(it.part) ? '' : ':'}</strong></span>
        <select class="fillSelect" id="pmSel_${idx}">
          <option value="">${q.placeholder || '--Seleccionar--'}</option>
          ${it.select.map(s => `<option value="${s}">${s}</option>`).join('')}
        </select>
      </div>
    `).join('');
    box.innerHTML = `
      ${rowHtml}
      <div style="width:100%;">${pmHtml}</div>
      <button class="optBtn correct" style="margin-top:10px;" onclick="checkPartMatchAnswers()">Comprobar Emparejamiento ✔️</button>
    `;
  }
}

function normWrite(s) {
  return (s || '').trim().toLowerCase().replace(/\s+/g, ' ');
}

    const val = normWrite(el.value);
    const ok = val !== '' && (val === normWrite(it.ans) || (it.alt || []).some(a => normWrite(a) === val));
    el.classList.remove('okIn', 'badIn');

/* TOPIC: ANIMAL MEMORY GAME */
function setupMemoryGame() {
  showScreen('screen-exercise');
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('exTitle').innerText = 'Animal Memory Game 🃏';
  document.getElementById('exSub').innerText = 'Match each animal picture with its English word:';
  document.getElementById('feedback').innerText = '';
  document.getElementById('continueBtn').style.display = 'none';

  // Each pair is one picture card + one word card, so the child has to
  // recognise the animal instead of matching two identical labels.
  const memoryPairs = [
    { id: 1, name: 'Eagle',      svg: eagleSVG },
    { id: 2, name: 'Bat',        svg: batSVG },
    { id: 3, name: 'Snake',      svg: snakeSVG },
    { id: 4, name: 'Octopus',    svg: octopusSVG },
    { id: 5, name: 'Fennec Fox', svg: fennecFoxSVG },
    { id: 6, name: 'Mosquito',   svg: mosquitoSVG }
  ];

  const cardsData = [];
  memoryPairs.forEach(p => {
    cardsData.push({ id: p.id, name: p.name, face: `<div class="memImg">${p.svg}</div>` });
    cardsData.push({ id: p.id, name: p.name, face: `<span class="memWord">${p.name}</span>` });
  });
  cardsData.sort(() => 0.5 - Math.random());

  let flippedCards = [];
  let matchedCount = 0;

  const box = document.getElementById('stageBox');
  let gridHtml = '<div class="memGrid">';
  cardsData.forEach((c, i) => {
    gridHtml += `<div class="memCard" id="mc_${i}" onclick="flipMemCard(${i})">?</div>`;
  });
  gridHtml += '</div>';
  box.innerHTML = gridHtml;

  window.flipMemCard = function(idx) {
    const card = cardsData[idx];
    const cardEl = document.getElementById(`mc_${idx}`);
    if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched') || flippedCards.length >= 2) return;

    cardEl.classList.add('flipped');
    cardEl.innerHTML = card.face;
    playTap();
    flippedCards.push({ idx, name: card.name, id: card.id, cardEl });

    if (flippedCards.length === 2) {
      if (flippedCards[0].id === flippedCards[1].id) {
        playCorrect();
        const matchedName = flippedCards[0].name;
        flippedCards[0].cardEl.classList.add('matched');
        flippedCards[1].cardEl.classList.add('matched');
        flippedCards = [];
        matchedCount++;
        totalStars += 5;
        updateStars();
        speakText(matchedName);
        if (matchedCount === memoryPairs.length) {
          document.getElementById('feedback').className = 'feedback ok';
          document.getElementById('feedback').innerText = `¡Felicidades! Encontraste todas las parejas 🏆 +${memoryPairs.length * 5} ⭐`;
          document.getElementById('continueBtn').style.display = 'block';
        } else {
          document.getElementById('feedback').className = 'feedback ok';
          document.getElementById('feedback').innerText = `¡${matchedName}! +5 ⭐`;
        }
      } else {
        playWrong();
        setTimeout(() => {
          flippedCards[0].cardEl.classList.remove('flipped');
          flippedCards[0].cardEl.innerHTML = '?';
          flippedCards[1].cardEl.classList.remove('flipped');
          flippedCards[1].cardEl.innerHTML = '?';
          flippedCards = [];
        }, 1000);
      }
    }
  };
}

  document.getElementById('exSub').innerText = 'Find the names of the different animals learned in class:';

/* Renders any word-search puzzle into the given container */
function renderWordSearch(cfg, box) {
  const matrix = cfg.matrix;
  const solutionCoords = cfg.solutionCoords;
  const targetWords = cfg.words;
  const rows = matrix.length;
  const cols = matrix[0].length;
  let foundWords = new Set();

  let wbHtml = '<div class="wordBankList">';
  targetWords.forEach((w, i) => {
    wbHtml += `<div class="wbItem" id="wbi_${i}">${i+1}. ${w.toLowerCase()}</div>`;
  });
  wbHtml += '</div>';

  let gridHtml = `<div class="wsGrid" style="grid-template-columns: repeat(${cols}, 1fr);">`;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      gridHtml += `<div class="wsCell" id="ws_${r}_${c}" onclick="clickWsCell(${r},${c})">${matrix[r][c]}</div>`;
    }
  }
  gridHtml += '</div>';

  let actionHtml = `
    <div class="wsActionRow">
      <button class="btnSolution" onclick="showWordSearchSolution()">Solución 💡</button>
      <button class="btnReset" onclick="resetWordSearch()">Reiniciar Ejercicio 🔄</button>
    </div>
  `;

  box.innerHTML = wbHtml + gridHtml + actionHtml;

  window.clickWsCell = function(r, c) {
    const cellEl = document.getElementById(`ws_${r}_${c}`);
    cellEl.classList.toggle('selected');
    playTap();
    checkAutomaticWordMatch();
  };

  function checkAutomaticWordMatch() {
    targetWords.forEach((w, i) => {
      if (foundWords.has(w)) return;
      const coords = solutionCoords[w];
      let allSelected = coords.every(([r,c]) => document.getElementById(`ws_${r}_${c}`).classList.contains('selected') || document.getElementById(`ws_${r}_${c}`).classList.contains('found'));
      if (allSelected) {
        foundWords.add(w);
        coords.forEach(([r,c]) => {
          const el = document.getElementById(`ws_${r}_${c}`);
          el.classList.remove('selected');
          el.classList.add('found');
        });
        document.getElementById(`wbi_${i}`).classList.add('done');
        playCorrect();
        totalStars += 5;
        updateStars();
      }
    });

    if (foundWords.size === targetWords.length) {
      document.getElementById('feedback').className = 'feedback ok';
      document.getElementById('feedback').innerText = `¡Felicidades! Encontraste todas las palabras 🏆 +${targetWords.length * 5} ⭐`;
      document.getElementById('continueBtn').style.display = 'block';
    }
  }

  window.showWordSearchSolution = function() {
    targetWords.forEach((w, i) => {
      foundWords.add(w);
      const coords = solutionCoords[w];
      coords.forEach(([r,c]) => {
        const el = document.getElementById(`ws_${r}_${c}`);
        el.classList.remove('selected');
        el.classList.add('found');
      });
      document.getElementById(`wbi_${i}`).classList.add('done');
    });
    playCorrect();
    document.getElementById('feedback').className = 'feedback ok';
    document.getElementById('feedback').innerText = '¡Solución mostrada correctamente!';
    document.getElementById('continueBtn').style.display = 'block';
  };

  window.resetWordSearch = function() {
    foundWords.clear();
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const el = document.getElementById(`ws_${r}_${c}`);
        el.classList.remove('selected', 'found');
      }
    }
    targetWords.forEach((w, i) => {
      document.getElementById(`wbi_${i}`).classList.remove('done');
    });
    document.getElementById('feedback').innerText = '';
    document.getElementById('continueBtn').style.display = 'none';
  };
}

function setupMysteryAnimal() {
  showScreen('screen-exercise');
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('exTitle').innerText = 'Mystery Animal Detective 🕵️';
  document.getElementById('exSub').innerText = 'Analyze the clues, identify the animal name, and draw it!';
  document.getElementById('feedback').innerText = '';
  document.getElementById('continueBtn').style.display = 'none';

  const box = document.getElementById('stageBox');
  box.innerHTML = `
    <div class="questionCard" style="background:#FFF3E0; border-color:#FFE0B2;">
      <h3 style="margin:0 0 8px; color:#E65100;">🔍 Investigation Clues:</h3>
      <p style="margin:4px 0;">• I am a very large and grey mammal.</p>
      <p style="margin:4px 0;">• I have 2 big ears to listen and regulate temperature.</p>
      <p style="margin:4px 0;">• I have a long trunk to grab objects.</p>
    </div>

    <div class="questionCard" style="display:flex; flex-direction:column; align-items:center; gap:8px;">
      <label style="font-family:'Fredoka'; font-size:18px;">Identify the animal:</label>
      <input type="text" id="mystInput" style="font-family:'Fredoka'; font-size:20px; text-transform:uppercase; text-align:center; padding:8px 14px; border:3px solid var(--sky-d); border-radius:14px; width:220px;" placeholder="Name...">
      <button class="optBtn correct" onclick="checkMysteryName()">Adivinar 🧠</button>
    </div>

    <div class="canvasWrap" id="canvasContainer" style="display:none; margin-top:14px;">
      <h3 style="margin:0;">🎨 Draw the mystery animal!</h3>
      <canvas id="paintCanvas" width="300" height="220"></canvas>
      <div class="toolRow">
        <div class="colorDot active" style="background:#2B2440" onclick="setBrushColor('#2B2440', this)"></div>
        <div class="colorDot" style="background:#3AC7E0" onclick="setBrushColor('#3AC7E0', this)"></div>
        <div class="colorDot" style="background:#FF6B5B" onclick="setBrushColor('#FF6B5B', this)"></div>
        <div class="colorDot" style="background:#4CAF6D" onclick="setBrushColor('#4CAF6D', this)"></div>
        <button class="optBtn" style="min-width:70px; padding:6px 12px; font-size:14px;" onclick="clearCanvas()">Borrar 🗑️</button>
        <button class="optBtn correct" style="min-width:90px; padding:6px 12px; font-size:14px;" onclick="revealOriginalDrawing()">Ver Ilustración 🐘</button>
      </div>
    </div>
  `;

  let currentColor = '#2B2440';
  window.checkMysteryName = function() {
    const val = document.getElementById('mystInput').value.trim().toUpperCase();
    if (val === 'ELEPHANT' || val === 'ELEFANTE') {
      playCorrect();
      totalStars += 20;
      updateStars();
      document.getElementById('feedback').className = 'feedback ok';
      document.getElementById('feedback').innerText = '¡Correcto! Es un ELEPHANT 🐘 +20 ⭐';
      document.getElementById('canvasContainer').style.display = 'flex';
      initCanvas();
      document.getElementById('continueBtn').style.display = 'block';
    } else {
      playWrong();
      document.getElementById('feedback').className = 'feedback bad';
      document.getElementById('feedback').innerText = 'Pista: Empieza por E y tiene trompa larga (ELEPHANT)';
    }
  };

  window.setBrushColor = function(color, dot) {
    currentColor = color;
    document.querySelectorAll('.colorDot').forEach(d => d.classList.remove('active'));
    dot.classList.add('active');
  };

  function initCanvas() {
    const cvs = document.getElementById('paintCanvas');
    const c = cvs.getContext('2d');
    let painting = false;

    function startDraw(e) { painting = true; draw(e); }
    function endDraw() { painting = false; c.beginPath(); }
    function draw(e) {
      if (!painting) return;
      const rect = cvs.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      c.lineWidth = 4;
      c.lineCap = 'round';
      c.strokeStyle = currentColor;
      c.lineTo(x, y);
      c.stroke();
      c.beginPath();
      c.moveTo(x, y);
    }

    cvs.addEventListener('mousedown', startDraw);
    cvs.addEventListener('mouseup', endDraw);
    cvs.addEventListener('mousemove', draw);
    cvs.addEventListener('touchstart', startDraw);
    cvs.addEventListener('touchend', endDraw);
    cvs.addEventListener('touchmove', draw);
  }

  window.clearCanvas = function() {
    const cvs = document.getElementById('paintCanvas');
    const c = cvs.getContext('2d');
    c.clearRect(0, 0, cvs.width, cvs.height);
  };

  window.revealOriginalDrawing = function() {
    const box = document.getElementById('stageBox');
    if (!document.getElementById('elephantSvgReveal')) {
      box.innerHTML += `<div id="elephantSvgReveal" class="svgContainer" style="width:200px; height:160px; margin-top:14px;">${elephantSVG}</div>`;
    }
  };
}
