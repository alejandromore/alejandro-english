<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Player</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="reader-container" id="readerContainer">

  <!-- Top bar -->
  <div class="reader-top-bar">
    <a href="index.html" class="rtb-back">←</a>
    <span class="rtb-title" id="rtbTitle">Loading...</span>
    <span class="rtb-cat" id="rtbCat"></span>
  </div>

  <!-- No speech warning -->
  <div class="no-speech" id="noSpeech" style="display:none">
    ⚠️ Your browser doesn't support text-to-speech. You can still read the text and click words for translations.
  </div>

  <!-- Image carousel area -->
  <div class="reader-image-area" id="readerImageArea">
    <div class="reader-loading"><div class="spinner"></div></div>
  </div>

  <!-- Controls bar -->
  <div class="reader-controls">
    <button class="ctrl-btn" id="btnPlay" title="Play / Pause">▶️</button>
    <span class="ctrl-info">🐢 0.7x · 🇺🇸 US English</span>
    <span class="ctrl-progress" id="ctrlProgress">Paragraph 1 of 1</span>
  </div>

  <!-- Text area -->
  <div class="reader-text-area" id="readerTextArea">
    <div class="reader-loading"><div class="spinner"></div><p>Loading reading...</p></div>
  </div>

  <!-- Complete indicator -->
  <div class="reading-complete" id="readingComplete">✅ Reading complete!</div>

  <!-- Quiz section -->
  <div class="quiz-section" id="quizSection">
    <div class="quiz-header">
      <h3>📝 Comprehension Quiz</h3>
      <p>Answer 5 questions about what you read</p>
    </div>
    <div id="quizQuestions"></div>
    <button class="quiz-submit" id="quizSubmit">Check Answers</button>
    <div class="quiz-result" id="quizResult"></div>
  </div>

</div>

<script src="app.js?v=4"></script>
</body>
</html>
